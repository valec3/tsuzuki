<nav class="filter-bar" aria-label="Herramientas y filtros de la biblioteca">

  <div class="top-row">
    <!-- Tarjetas de Estadísticas Rápidas -->
    <div class="metrics-group">
      <!-- Métrica 1: En Lectura / Tomos -->
      <div class="metric-card">
        <div class="metric-icon gold" aria-hidden="true">
          <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="metric-body">
          <div class="metric-label">
            <span>EN</span>
            <span>LECTURA</span>
          </div>
          <div class="metric-value-row">
            <span class="metric-num">{{ readingTomosCount() }}</span>
            <span class="metric-sub">Tomos</span>
          </div>
        </div>
      </div>

      <!-- Métrica 2: Capítulos Leídos -->
      <div class="metric-card">
        <div class="metric-icon cyan" aria-hidden="true">
          <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
        </div>
        <div class="metric-body">
          <div class="metric-label">
            <span>CAPÍTULOS</span>
            <span>LEÍDOS</span>
          </div>
          <span class="metric-num">{{ totalChaptersRead() }}</span>
        </div>
      </div>

      <!-- Métrica 3: Racha Activa -->
      <div class="metric-card">
        <div class="metric-icon flame" aria-hidden="true">
          <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/>
          </svg>
        </div>
        <div class="metric-body">
          <div class="metric-label">
            <span>RACHA</span>
            <span>ACTIVA</span>
          </div>
          <span class="metric-num flame-text">18 Días</span>
        </div>
      </div>

      <!-- Métrica 4: Sincronía -->
      <div class="metric-card">
        <div class="metric-icon sync" aria-hidden="true">
          <svg class="icon-svg" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/>
            <path d="M3 3v5h5"/>
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/>
            <path d="M16 21h5v-5"/>
          </svg>
        </div>
        <div class="metric-body">
          <div class="metric-label">
            <span>SINCRONÍA</span>
          </div>
          <span class="metric-num sync-text">Hace 5m</span>
        </div>
      </div>
    </div>

    <!-- Buscador con Atajo de Teclado (Ctrl + K) + Botón de Filtros Avanzados -->
    <div class="search-section">
      <div class="search-input-wrapper">
        <span class="search-icon" aria-hidden="true">
          <svg class="search-icon-svg" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
        </span>
        <input
          type="search"
          class="grimoire-search"
          [value]="searchQuery()"
          (input)="onSearchInput($event)"
          placeholder="Buscar manga, novela o autor (Ctrl + K)..."
          aria-label="Buscar manga, novela o autor"
        />
        <kbd class="shortcut-badge">⌘K</kbd>
      </div>

      <button type="button" class="btn-filter-tune" aria-label="Filtros avanzados">
        <span class="tune-icon" aria-hidden="true">
          <svg class="tune-icon-svg" xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="21" x2="4" y2="14"/>
            <line x1="4" y1="10" x2="4" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="12"/>
            <line x1="12" y1="8" x2="12" y2="3"/>
            <line x1="20" y1="21" x2="20" y2="16"/>
            <line x1="20" y1="12" x2="20" y2="3"/>
            <line x1="1" y1="14" x2="7" y2="14"/>
            <line x1="9" y1="8" x2="15" y2="8"/>
            <line x1="17" y1="16" x2="23" y2="16"/>
          </svg>
        </span>
      </button>
    </div>
  </div>

  <div class="bottom-row">
    <!-- 1. Tabs de Estado estilo Píldora Segmentada (Pill Tabs) -->
    <div class="status-tabs" role="tablist" aria-label="Estados de lectura">
      @for (option of statusOptions; track option.value) {
        <button
          type="button"
          role="tab"
          class="tab"
          [class.active]="currentStatus === option.value"
          [attr.aria-selected]="currentStatus === option.value"
          (click)="setStatus(option.value)"
        >
          <span class="tab-label">{{ option.label }}</span>
          <span
            class="tab-count"
            [class.cyan]="option.value === 'completado'"
          >{{ statusCounts()[option.value] ?? 0 }}</span>
        </button>
      }
    </div>

    <!-- 2. Ordenamiento ("Última lectura") + Toggle Grid/Lista -->
    <div class="view-controls">
      <!-- Selector de Ordenamiento Elegante -->
      <div class="sort-wrapper">
        <button type="button" class="sort-dropdown-trigger" aria-haspopup="listbox" aria-expanded="false">
          <span class="sort-icon" aria-hidden="true">⇅</span>
          <span class="sort-label">Última lectura</span>
          <span class="chevron-icon" aria-hidden="true">▾</span>
        </button>
      </div>

      <!-- Toggle de Modo de Vista (Grid ⊞ / List ☰) -->
      <div class="view-toggle" role="group" aria-label="Modo de visualización">
        <button
          type="button"
          class="btn-view"
          [class.active]="currentViewMode === 'grid'"
          (click)="setViewMode('grid')"
          title="Vista Cuadrícula"
          aria-label="Vista Cuadrícula"
        >
          <span class="grid-icon" aria-hidden="true">⊞</span>
        </button>
        <button
          type="button"
          class="btn-view"
          [class.active]="currentViewMode === 'list'"
          (click)="setViewMode('list')"
          title="Vista Lista"
          aria-label="Vista Lista"
        >
          <span class="list-icon" aria-hidden="true">☰</span>
        </button>
      </div>
    </div>
  </div>
</nav>
